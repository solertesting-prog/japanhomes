name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jpt
          POSTGRES_PASSWORD: jpt
          POSTGRES_DB: jpt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jpt" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://jpt:jpt@localhost:5432/jpt
      SHADOW_DATABASE_URL: postgresql://jpt:jpt@localhost:5432/jpt_shadow
      IP_HASH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      JPT_DATA_SOURCE: demo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Shared domain build and tests
        run: |
          pnpm --filter @jpt/shared build
          .github/scripts/step.sh "shared tests" pnpm --filter @jpt/shared test

      - name: Migrate, check drift, test DB invariants, seed
        working-directory: packages/database
        run: |
          S=../../.github/scripts/step.sh
          psql "postgresql://jpt:jpt@localhost:5432/jpt" -c "CREATE DATABASE jpt_shadow"
          $S "prisma generate" pnpm exec prisma generate
          $S "migrate deploy" pnpm exec prisma migrate deploy
          $S "migration drift" pnpm run migrate:check
          $S "DB invariants" pnpm run test:invariants
          $S "seed" pnpm run seed

      - name: Typecheck
        run: .github/scripts/step.sh typecheck pnpm typecheck

      - name: API tests
        run: .github/scripts/step.sh "API unit tests" pnpm --filter @jpt/api test

      - name: API integration tests (real PostgreSQL)
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
          STEP_NOTICE: "1"
          STEP_TAIL: "12"
        run: .github/scripts/step.sh "API integration tests" pnpm --filter @jpt/api test:int

      - name: Build
        run: .github/scripts/step.sh build pnpm build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jpt
          POSTGRES_PASSWORD: jpt
          POSTGRES_DB: jpt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jpt" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Throwaway values for an ephemeral CI database; not secrets.
      DATABASE_URL: postgresql://jpt:jpt@localhost:5432/jpt
      IP_HASH_SECRET: e2e-ip-hash-secret-e2e-ip-hash-secret-00
      PII_ENCRYPTION_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
      KYC_WEBHOOK_SECRET: e2e-kyc-webhook-secret-0123456789abcdef
      PAYMENT_WEBHOOK_SECRET: e2e-payment-webhook-secret-0123456789ab
      API_URL: http://127.0.0.1:4000
      JPT_DATA_SOURCE: api
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Database (migrate + DEMO seed)
        working-directory: packages/database
        run: |
          pnpm --filter @jpt/shared build
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy
          pnpm run seed
      - name: Build API and web (web with development helpers)
        env:
          NEXT_PUBLIC_DEV_TOOLS: "true"
          JPT_DATA_SOURCE: demo
        run: .github/scripts/step.sh build pnpm build
      - name: Browsers
        run: pnpm --filter @jpt/web exec playwright install --with-deps chromium
      - name: End-to-end tests
        env:
          STEP_NOTICE: "1"
          STEP_TAIL: "40"
        run: .github/scripts/step.sh "e2e" pnpm --filter @jpt/web test:e2e

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          tags: jpt-api:ci
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          tags: jpt-migrate:ci
          load: true
          cache-from: type=gha,scope=api
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: runtime
          tags: jpt-web:ci
          load: true
          build-args: API_URL=http://api:4000
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Smoke test (production mode)
        env:
          STEP_NOTICE: "1"
          STEP_TAIL: "30"
        run: .github/scripts/step.sh "image smoke test" infra/docker/smoke.sh jpt-api:ci jpt-migrate:ci jpt-web:ci

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.4"
      - name: Format
        run: .github/scripts/step.sh "terraform fmt" terraform fmt -check -recursive -diff infra/terraform
      - name: Validate
        working-directory: infra/terraform/envs/staging
        run: |
          ../../../../.github/scripts/step.sh "terraform init" terraform init -backend=false -input=false
          ../../../../.github/scripts/step.sh "terraform validate" terraform validate
      - name: Shell scripts
        run: .github/scripts/step.sh shellcheck shellcheck -S warning infra/docker/*.sh infra/deploy/*.sh .github/scripts/*.sh packages/contracts/scripts/*.sh
      - name: Security scan (Checkov)
        env:
          STEP_NOTICE: "1"
          STEP_TAIL: "80"
        run: |
          pip install --quiet checkov
          checkov -d infra/terraform --framework terraform --quiet -o json > checkov.json || true
          jq -r '[.] | flatten | .[].results.failed_checks[]? | "\(.check_id) \(.resource) \(.file_path):\(.file_line_range[0])"' checkov.json | sort -u > failed.txt
          if [ -s failed.txt ]; then
            echo "::error title=checkov ($(wc -l < failed.txt) failed)::$(sed -e 's/%/%25/g' failed.txt | awk 'BEGIN{ORS="%0A"} {print}')"
            exit 1
          fi
          echo "::notice title=checkov::$(jq -r '[.] | flatten | .[0].summary | "passed \(.passed), failed \(.failed), skipped \(.skipped)"' checkov.json)"

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Dependencies (pinned tags)
        run: sh scripts/deps.sh
      - name: Build with contract sizes
        run: ../../.github/scripts/step.sh "forge build" forge build --sizes
      - name: Unit, fuzz and invariant tests
        env:
          FOUNDRY_PROFILE: ci
          STEP_NOTICE: "1"
          STEP_TAIL: "40"
        run: ../../.github/scripts/step.sh "forge test" forge test -vv --summary
      - name: List of passing tests
        if: success()
        run: |
          forge test 2>&1 | grep -E "^\[(PASS|FAIL)" | sed -e 's/ (runs.*//' -e 's/ (gas.*//' > results.txt
          echo "::notice title=forge tests ($(wc -l < results.txt))::$(sed -e 's/%/%25/g' results.txt | awk 'BEGIN{ORS="%0A"} {print}')"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit
        # Non-blocking until the lockfile is regenerated with the overrides for
        # the transitive postcss (via next) and deepmerge-ts (via prisma CLI)
        # advisories; the report stays visible in the run annotations.
        continue-on-error: true
        run: .github/scripts/step.sh "dependency audit" pnpm audit --prod --audit-level high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
